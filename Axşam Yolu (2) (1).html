/* Layout: one-screen driving game. Road view fills the screen, steering wheel bottom-left, pedals bottom-right. Single dusk look by design. */
:root {

  background: var(--bg);

  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
  overscroll-behavior: none;
}
.app {
  height: 100%;
  max-width: 520px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
header { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
h1 { margin: 0; font-family: var(--font-display); font-size: 1.25rem; letter-spacing: 0.02em; }
.chips { display: flex; gap: 8px; }
.chip {
  appearance: none;
  cursor: pointer;
  font: inherit;
  font-size: 0.82rem;
  font-weight: 600;
  color: var(--fg);
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 7px 13px;
}
.chip:focus-visible, .btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.view {
  position: relative;
  flex: 1 1 0;
  min-height: 0;
  border-radius: 14px;
  overflow: hidden;
  border: 1px solid var(--line);
  background: #140f33;
}
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.hud {

  justify-content: space-between;

.speed small { color: var(--muted); font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase; }
.dmg { display: flex; align-items: center; gap: 6px; margin-top: 8px; font-size: 0.7rem; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; }
.dmg i { display: block; width: 92px; height: 7px; border-radius: 4px; background: rgba(255, 255, 255, 0.16); overflow: hidden; }
.dmg u { display: block; height: 100%; width: 0%; text-decoration: none; background: linear-gradient(90deg, #5ee0a0, #ffd166 55%, #ff4d5a); background-size: 92px 100%; }
.dmg b { color: var(--fg); font-variant-numeric: tabular-nums; min-width: 2.6em; }
.wx {
  pointer-events: auto; margin-top: 6px; cursor: pointer; font: inherit; font-size: 0.7rem; font-weight: 600;
  letter-spacing: 0.06em; text-transform: uppercase; color: var(--fg); background: rgba(13, 11, 28, 0.55);
  border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; text-shadow: none;
}
.wx:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
canvas#sky { pointer-events: none; }
.stats { display: grid; grid-template-columns: auto auto; gap: 2px 10px; text-align: right; font-size: 0.8rem; }
.stats span { color: var(--muted); }
.stats b { font-variant-numeric: tabular-nums; }

.overlay {
  position: absolute;
  inset: 0;
  background: rgba(13, 11, 28, 0.82);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  text-align: center;
  padding: 24px;

.overlay h2 { margin: 0; font-family: var(--font-display); font-size: 1.9rem; text-wrap: balance; }
.overlay p { margin: 0; color: var(--muted); max-width: 30ch; line-height: 1.5; }
.btn {

  align-items: flex-end;
  gap: 12px;
  touch-action: none;

  cursor: grab;

  justify-content: center;
  padding-top: 10px;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 0.74rem;
  letter-spacing: 0.12em;
  color: var(--muted);

.pedal.gas { width: 78px; height: 138px; }
.pedal.brake.down { transform: scaleY(0.94); border-color: var(--stop); color: var(--stop); }
.pedal.gas.down { transform: scaleY(0.94); border-color: var(--go); color: var(--go); }
@media (max-height: 700px) {
  .wheel { width: min(40vw, 138px); }
  .pedal.brake { height: 82px; }
  .pedal.gas { height: 114px; }
  .speed b { font-size: 2rem; }
}
@media (prefers-reduced-motion: reduce) { .pedal { transition: none; } }

          tc = tq * 0.667 + ts * 0.1;
          ctx.moveTo(a.x + a.w * (tc - 0.04), a.y); ctx.lineTo(a.x + a.w * (tc + 0.04), a.y);
          ctx.lineTo(b.x + b.w * (tc + 0.04), b.y); ctx.lineTo(b.x + b.w * (tc - 0.04), b.y); ctx.closePath();
        }
        ctx.fillStyle = "rgba(6,6,12,0.16)"; ctx.fill();
        if (env.rain > 0.15) poly(a.x - a.w, a.y, a.x + a.w, a.y, b.x + b.w, b.y, b.x - b.w, b.y, "rgba(150,170,205," + (0.07 * env.rain).toFixed(3) + ")");
      }
      if (seg.br) {
        var bq = seg.br, bsd = bq.side, bi1 = 1.12 + bq.o, bi2 = 1.12 + bq.o2, bo1 = bi1 + 2, bo2 = bi2 + 2;
        poly(a.x + bsd * a.w * bi1, a.y, a.x + bsd * a.w * bo1, a.y, b.x + bsd * b.w * bo2, b.y, b.x + bsd * b.w * bi2, b.y, dk ? "#303342" : "#363949");
        poly(a.x + bsd * a.w * (bo1 - 0.08), a.y, a.x + bsd * a.w * bo1, a.y, b.x + bsd * b.w * bo2, b.y, b.x + bsd * b.w * (bo2 - 0.08), b.y, "#d9d6cc");
        poly(a.x + bsd * a.w * bi1, a.y, a.x + bsd * a.w * (bi1 + 0.08), a.y, b.x + bsd * b.w * (bi2 + 0.08), b.y, b.x + bsd * b.w * bi2, b.y, "#d9d6cc");
      }
      if (!dk) {
        var l1 = a.w / 32, l2 = b.w / 32, lw1 = a.w * 2 / 3, lw2 = b.w * 2 / 3;
        var lx1 = a.x - a.w + lw1, lx2 = b.x - b.w + lw2;
        for (var ln = 1; ln < 3; ln++) {
          poly(lx1 - l1 / 2, a.y, lx1 + l1 / 2, a.y, lx2 + l2 / 2, b.y, lx2 - l2 / 2, b.y, "#f0ece4");
          lx1 += lw1; lx2 += lw2;
        }
      }
    }

    for (n = drawDist - 1; n >= 0; n--) {
      seg = segments[(base.index + n) % segments.length];
      if (!seg.vis) continue;
      var sc = seg.p1.screen.scale, sx0 = seg.p1.screen.x, sy0 = seg.p1.screen.y;
      drawRail(seg);
      for (i = 0; i < seg.bld.length; i++) {
        var bd = seg.bld[i];
        drawBuilding(sx0 + sc * bd.offset * roadW * W / 2, sy0, sc * bd.bw * roadW * W / 2, sc * bd.bh * H / 2, bd);
      }
      if (seg.fn) {
        var fa = seg.p1.screen, fb = seg.p2.screen;
        for (var fq = 0; fq < 2; fq++) {
          var fs = fq ? 1 : -1;
          if (!(seg.fn === 2 || seg.fn === fs)) continue;
          var fx1 = fa.x + fs * fa.w * 1.45, fx2 = fb.x + fs * fb.w * 1.45;
          var fh1 = fa.scale * 380 * H / 2, fh2 = fb.scale * 380 * H / 2;
          var ft1 = Math.max(1, fa.scale * 30 * H / 2), ft2 = Math.max(1, fb.scale * 30 * H / 2);
          poly(fx1, fa.y - fh1, fx1, fa.y - fh1 + ft1, fx2, fb.y - fh2 + ft2, fx2, fb.y - fh2, "#8a6a45");
          poly(fx1, fa.y - fh1 * 0.55, fx1, fa.y - fh1 * 0.55 + ft1, fx2, fb.y - fh2 * 0.55 + ft2, fx2, fb.y - fh2 * 0.55, "#8a6a45");
          ctx.fillStyle = "#6e5436"; ctx.fillRect(fx1 - ft1 / 2, fa.y - fh1, ft1, fh1);
        }
      }
      for (i = 0; i < seg.props.length; i++) {
        var pp = seg.props[i];
        drawProp(sx0 + sc * pp.off * roadW * W / 2, sy0, sc, pp);
      }
      for (i = 0; i < seg.deb.length; i++) {
        var db = seg.deb[i];
        drawDebris(sx0 + sc * db.off * roadW * W / 2, sy0, sc * db.sz * W / 2, db);
      }
      for (i = 0; i < seg.trees.length; i++) {
        var tr = seg.trees[i], th = sc * 1500 * H / 2;
        if (th < 3) continue;
        drawTree(sx0 + sc * tr.offset * roadW * W / 2, sy0, th * (0.85 + tr.big * 0.35), tr.round);
      }
      if (seg.sign) drawSign(sx0 + sc * seg.sign.side * 1.3 * roadW * W / 2, sy0, sc, seg.sign);
      if (seg.lamp) {
        var lh = sc * 3200 * H / 2;
        if (lh >= 4) drawLamp(sx0 + sc * seg.lamp * roadW * W / 2, sy0, lh, seg.lamp);
      }
      for (i = 0; i < seg.cars.length; i++) {
        var c = seg.cars[i], pc2 = (c.z % segLen) / segLen;
        var s1 = seg.p1.screen, s2 = seg.p2.screen;
        var scl = s1.scale + (s2.scale - s1.scale) * pc2;
        var cx = s1.x + (s2.x - s1.x) * pc2 + scl * c.offset * roadW * W / 2;
        var cy = s1.y + (s2.y - s1.y) * pc2;
        var cw = scl * (W / 2) * carW;
        if (cw < 3) continue;
        drawCar(cx, cy, cw, c);
        var nk2 = nightK();
        if (cw > 8 && (nk2 > 0.05 || c.brakeOn)) {
          var Tc = TYPES[c.type] || TYPES.sedan, w2 = cw * Tc.ws, ly2 = cy - w2 * (Tc.lowTop > 0.9 ? 0.4 : Tc.lowTop - 0.1), ta2 = Math.max(nk2 * 0.7, c.brakeOn ? 0.9 : 0);
          glows.push({ x: cx - w2 * 0.36, y: ly2, r: w2 * 0.22, c: "#ff3040", a: ta2, streak: true }, { x: cx + w2 * 0.36, y: ly2, r: w2 * 0.22, c: "#ff3040", a: ta2, streak: true });
        }
      }
    }

    var fg = ctx.createLinearGradient(0, hy - H * 0.02, 0, hy + H * 0.16);
    var hz = skyArr(3);
    fg.addColorStop(0, rgba(hz, (0.5 + 0.35 * env.rain).toFixed(2))); fg.addColorStop(1, rgba(hz, 0));
    ctx.fillStyle = fg; ctx.fillRect(-20, hy - H * 0.02, W + 40, H * 0.18);
    ctx.save(); ctx.translate(W / 2, hy + H * 0.05); ctx.scale(1, 0.2);
    var rg = ctx.createRadialGradient(0, 0, 0, 0, 0, W * 0.5);
    rg.addColorStop(0, "rgba(255,170,100," + (0.38 * env.wu).toFixed(3) + ")"); rg.addColorStop(1, "rgba(255,170,100,0)");
    ctx.fillStyle = rg; ctx.beginPath(); ctx.arc(0, 0, W * 0.5, 0, TAU); ctx.fill();
    ctx.restore();

    var pw = (camDepth / playerZ) * (W / 2) * carW;
    var py = hy + (camDepth / playerZ) * camH * H / 2;
    if (Math.abs(playerX) > 0.9 && speed > 800) py += Math.sin(clock * 55) * H * 0.004;

    if (skidAmt > 0.03 && !inside) {
      ctx.strokeStyle = "rgba(4,4,8," + Math.min(0.5, skidAmt * 0.6).toFixed(3) + ")";
      ctx.lineWidth = pw * 0.13; ctx.lineCap = "butt";
      for (var sk = -1; sk <= 1; sk += 2) {
        ctx.beginPath(); ctx.moveTo(W / 2 + sk * pw * 0.3, py + 2); ctx.lineTo(W / 2 + sk * pw * 0.45, H + 12); ctx.stroke();
      }
    }
    if (brake && state === "playing" && !inside) {
      ctx.save(); ctx.translate(W / 2, py + pw * 0.06); ctx.scale(1, 0.3);
      var bg = ctx.createRadialGradient(0, 0, 0, 0, 0, pw * 0.95);
      bg.addColorStop(0, "rgba(255,40,50,0.4)"); bg.addColorStop(1, "rgba(255,40,50,0)");
      ctx.fillStyle = bg; ctx.beginPath(); ctx.arc(0, 0, pw * 0.95, 0, TAU); ctx.fill();
      ctx.restore();
    }

    var steer = Math.max(-1, Math.min(1, wheelAngle / 70));
    pc.brakeOn = brake && state !== "over";
    pc.hazard = state === "over";
    pc.lean = steer * 0.05 * Math.min(1, speed / (maxSpeed * 0.3));
    if (!inside) drawCar(W / 2, py, pw, pc);
    washWorld();
    drawEmissive(pw, py);

    if (damage > 0.25) {
      var sa = Math.min(1, damage * 1.6), gy = inside ? H - Math.min(W, H) * 0.42 : py - pw * 0.78;
      for (i = 0; i < 6; i++) {
        var t = (clock * 0.7 + i / 6) % 1, gray = Math.round(110 - 70 * damage);
        ctx.fillStyle = "rgba(" + gray + "," + gray + "," + (gray + 8) + "," + ((1 - t) * 0.5 * sa).toFixed(3) + ")";
        ctx.beginPath(); ctx.arc(W / 2 + Math.sin(clock * 2 + i * 1.7) * pw * 0.12 + t * pw * 0.12, gy - t * pw * 0.9, pw * (0.07 + 0.17 * t), 0, TAU); ctx.fill();
      }
      if (damage > 0.8) {
        for (i = 0; i < 5; i++) {
          var fx = W / 2 + (i - 2) * pw * 0.08, fh = pw * (0.13 + 0.12 * Math.random());
          ctx.fillStyle = "rgba(255,140,40,0.85)";
          ctx.beginPath(); ctx.moveTo(fx - pw * 0.05, gy + pw * 0.04); ctx.lineTo(fx + pw * 0.05, gy + pw * 0.04); ctx.lineTo(fx, gy - fh); ctx.closePath(); ctx.fill();
          ctx.fillStyle = "rgba(255,225,120,0.9)";
          ctx.beginPath(); ctx.moveTo(fx - pw * 0.025, gy + pw * 0.04); ctx.lineTo(fx + pw * 0.025, gy + pw * 0.04); ctx.lineTo(fx, gy - fh * 0.55); ctx.closePath(); ctx.fill();
        }
      }
    }

    for (i = 0; i < parts.length; i++) {
      var p = parts[i], al = 1 - p.t / p.life;
      if (p.debris) {
        ctx.fillStyle = p.col; ctx.globalAlpha = al;
        ctx.fillRect(p.x, p.y, Math.max(2, dpr * 3), Math.max(2, dpr * 2));
        ctx.globalAlpha = 1;
      } else {
        ctx.strokeStyle = "rgba(255,210,122," + al.toFixed(2) + ")"; ctx.lineWidth = Math.max(1.5, dpr * 2);
        ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx * 0.035, p.y - p.vy * 0.035); ctx.stroke();
      }
    }

    var sp = speed / maxSpeed;
    if (sp > 0.6 && state === "playing") {
      ctx.lineWidth = Math.max(1, dpr);
      for (i = 0; i < 14; i++) {
        var ang = 0.1 + (i / 13) * (Math.PI - 0.2);
        if (Math.abs(Math.cos(ang)) < 0.6) continue;
        var tt = (clock * 2.4 + i * 0.37) % 1, r0 = tt * tt * W * 1.1, r1b = r0 + W * 0.1 * tt;
        ctx.strokeStyle = "rgba(255,255,255," + ((sp - 0.6) * 0.35 * tt).toFixed(3) + ")";
        ctx.beginPath(); ctx.moveTo(W / 2 + Math.cos(ang) * r0, hy + Math.sin(ang) * r0 * 0.8); ctx.lineTo(W / 2 + Math.cos(ang) * r1b, hy + Math.sin(ang) * r1b * 0.8); ctx.stroke();
      }
    }
    ctx.restore();

    bloom();
    if (inside) drawCockpit();
    if (flash > 0.01) { ctx.fillStyle = "rgba(255,70,50," + (flash * 0.28).toFixed(3) + ")"; ctx.fillRect(0, 0, W, H); }
    if (vignette) { ctx.fillStyle = vignette; ctx.fillRect(0, 0, W, H); }
    if (fade > 0.01) { ctx.fillStyle = "rgba(0,0,0," + Math.min(1, fade).toFixed(3) + ")"; ctx.fillRect(0, 0, W, H); }
  }

  /* ---------- HUD ---------- */
  var lastHud = "", curZone = "", wxEl = $("wx");
  function updateHud(force) {
    var zs = findSeg(position + playerZ).z, lbl = (zs ? ZN[zs.type] : "") + " · " + PHN[env.tPhase] + (env.tRain ? " · Yağış" : "");
    if (lbl !== curZone) { curZone = lbl; wxEl.textContent = lbl; }
    var s = Math.round((revMode ? revSpeed : speed) / maxSpeed * 240), dp = Math.round(damage * 100);
    var key = s + "|" + Math.floor(dist * 0.005556 / 100) + "|" + passes + "|" + crashes + "|" + dp;
    if (!force && key === lastHud) return;
    lastHud = key;
    speedEl.textContent = revMode && revSpeed > 5 ? "R" + s : s;
    distEl.textContent = (dist * 0.005556 / 1000).toFixed(1);
    passEl.textContent = passes;
    crashEl.textContent = crashes;
    dmgBar.style.width = dp + "%";
    dmgPct.textContent = dp + "%";
  }

  /* ---------- Loop ---------- */
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    var w = view.clientWidth, h = view.clientHeight;
    if (w < 10 || h < 10) return;
    canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
    skyCanvas.width = canvas.width; skyCanvas.height = canvas.height;
    W = canvas.width; H = canvas.height; hy = H * 0.42;
    vignette = ctx.createRadialGradient(W / 2, H * 0.55, Math.min(W, H) * 0.35, W / 2, H * 0.55, Math.max(W, H) * 0.75);
    vignette.addColorStop(0, "rgba(5,3,15,0)"); vignette.addColorStop(1, "rgba(5,3,15,0.5)");
  }
  window.addEventListener("resize", resize);
  var PRESETS = [["day", 0], ["day", 1], ["dusk", 0], ["dusk", 1], ["night", 0], ["night", 1]];
  wxEl.addEventListener("click", function () {
    var cur = 0, i;
    for (i = 0; i < PRESETS.length; i++) if (PRESETS[i][0] === env.tPhase && PRESETS[i][1] === env.tRain) cur = i;
    var nx = PRESETS[(cur + 1) % PRESETS.length];
    env.tPhase = nx[0]; env.tRain = nx[1]; env.timer = 150;
  });

  var last = 0;
  function frame(t) {
    var dt = Math.min(0.05, (t - last) / 1000 || 0);
    last = t; clock += dt; frameDt = dt; fade = Math.max(0, fade - dt * 2);
    qAvg += (dt - qAvg) * 0.05; qT += dt;
    if (qT > 1) { qT = 0; if (qAvg > 0.026 && drawDist > 70) drawDist -= 12; else if (qAvg < 0.0185 && drawDist < 130) drawDist += 6; } updateEnv(dt);
    steerWheel(dt);
    if (state === "playing" || state === "over") update(dt);
    else { shake = Math.max(0, shake - dt * 2.2); flash = Math.max(0, flash - dt * 2.2); }
    render(); updateHud(false); updateAudio();
    requestAnimationFrame(frame);
  }

  buildTrack();
  resetGame();
  resize();
  requestAnimationFrame(frame);
})();
</script>
